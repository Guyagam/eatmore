name: Deploy to GitHub Pages

# Pushing this file needs a token with the `workflow` scope:
#   gh auth refresh -s workflow
# Without it, use `npm run deploy:pages` from your machine instead and point
# Pages at the gh-pages branch. Both routes publish the same export.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The base path has to match the repo name, or every asset 404s.
      - run: node scripts/build-pages.mjs --base "/${GITHUB_REPOSITORY#*/}"

      # enablement turns Pages on from here, so the repo going public is the
      # only manual step. On a free plan a private repo still can't serve
      # Pages, and this step is where that shows up.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
